name: Screenshots

# Walks the app in Chromium and pushes the PNGs to the ci/screenshots
# branch, so README images always come from the real page.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - ci/screenshots
    paths:
      - "index.html"
      - "scripts/screenshots.mjs"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Capture
        run: node scripts/screenshots.mjs shots

      - name: Push to ci/screenshots
        run: |
          cd shots
          git init -q -b ci/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci/screenshots
